name: Eval tick

on:
  schedule:
    # GitHub delays public cron (often hours). Tick uses FPL next unfinished GW / kickoff / bonus.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: eval-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout fpl-radar-backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zchaarim/fpl-radar-backend
          path: .deps/fpl-radar-backend
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .deps/fpl-radar-backend
          python -m pip install -e . --no-deps
      - name: Tick
        env:
          FPL_DATA_DIR: ${{ github.workspace }}/.deps/fpl-radar-backend/data
        run: python -m fpl_radar_eval tick
      - name: Commit snapshots and scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/scored
          if git diff --staged --quiet; then
            echo "No eval files to commit"
            exit 0
          fi
          git commit -m "eval: snapshot or score from FPL calendar tick"
          git push
