[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-radar-eval"
version = "0.1.0"
description = "Offline scoring of FPL Radar xP against live gameweek points."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fpl-radar-backend @ file:../fpl-radar-backend",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
fpl-radar-eval = "fpl_radar_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
